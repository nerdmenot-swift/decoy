name: Windows

# Split out of ci.yml so Windows has a badge of its own. The Swift Package Index builds
# for every other platform Decoy claims and shows the result on its Platforms badge, but
# it has no Windows builders, so this workflow is the only public record that Windows
# works. Same triggers as CI: every push to main and every pull request. Rebuilding from
# the upstreams is the Upstreams workflow's job, on all platforms at once.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforced, now that it passes.
  #
  # This was continue-on-error while Windows could not get through the build, which was the
  # right call then and the wrong one the moment it went green: an allowed failure is a
  # standing exemption, and the next regression would have been invisible inside it. The
  # three things that had to be fixed to get here -- a Foundation-only String API, an ESM
  # loader that rejects `D:\...`, and CRLF being a single Swift Character -- were all
  # silent everywhere else, which is the argument for keeping this honest.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit, not to `main`. This is a third-party action, and it runs in
      # the job that builds on Windows -- previously also the job that produced and signed
      # release artifacts. A moving ref there means whoever controls that branch chooses
      # what runs in a workflow holding a write token.
      #
      # Bump deliberately: read the diff, then move the SHA.
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - run: swift --version
      - run: swift build

      - name: The committed corpus is present
        shell: bash
        run: |
          count=$(ls Corpus/binary/*.decoy 2>/dev/null | wc -l | tr -d ' ')
          [ "$count" -gt 50 ] || { echo "::error::only $count corpus blobs found; the integration suites would skip."; exit 1; }
          echo "$count locale blobs"

      - run: swift test
