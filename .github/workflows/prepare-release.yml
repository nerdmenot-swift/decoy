# Sets the version and pushes the tag that triggers Release.
#
# Run from the Actions tab with the version you want. It exists because the version lives
# in source (`Decoy.version`) and in the tag, and doing that by hand is how the two come
# to disagree — which is the same failure the generator counts had three times over.
#
# It deliberately does not decide the number for you. Whether a change is major is a
# judgement about what it does to somebody's existing fixtures, and nothing in a workflow
# can make that call.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.0)'
        required: true
        type: string
      dry-run:
        description: 'Show what would change without committing or tagging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # Dispatching Release needs this, and only this step needs it. Without it the tag is
  # pushed and `gh workflow run` comes back 403 "Resource not accessible by integration" --
  # so the version is tagged, nothing is published, and the run reports failure *after* the
  # irreversible half has already happened. Which is exactly what 1.0.0 did.
  actions: write

jobs:
  prepare:
    name: Prepare ${{ inputs.version }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate
        run: |
          version="${{ inputs.version }}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not semver. Use 1.0.0, or 1.0.0-rc.1."
            exit 1
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists. A released version is never re-cut."
            exit 1
          fi

      - name: Set Decoy.version
        run: |
          version="${{ inputs.version }}"
          current=$(grep -oE 'static let version = "[^"]+"' Sources/Decoy/Decoy.swift \
                    | grep -oE '"[^"]+"' | tr -d '"')
          echo "$current -> $version"
          sed -i '' "s/static let version = \"$current\"/static let version = \"$version\"/" \
            Sources/Decoy/Decoy.swift
          grep -n 'static let version' Sources/Decoy/Decoy.swift

      # The version is embedded in generated website content -- the API index and the
      # samples both say which Decoy produced them -- so bumping it makes those files
      # stale. 1.1.1 committed only Decoy.swift, main went red on the "Website content is
      # current" check, and the site would have shipped the new version's docs under the
      # old number. Regenerated here so the release commit carries everything the bump
      # touches. Pinned bun, as in ci.yml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: swift build

      - name: Regenerate website content
        run: cd website && bun install --frozen-lockfile && bun run extract

      # The tag is what people install, so it is cut from a commit that is known to build
      # and pass rather than one that is merely well-formed.
      #
      # Tested against the committed corpus, not a rebuilt one, for the reason Release
      # gives: rebuilding made every release hostage to fifty-four upstreams being
      # reachable and byte-identical, and tested a corpus no user receives. The suites that
      # need the pipeline's intermediate output skip when it is absent and say so.
      - name: The committed corpus is present
        run: |
          count=$(ls Corpus/binary/*.decoy 2>/dev/null | wc -l | tr -d ' ')
          [ "$count" -gt 50 ] || { echo "::error::only $count corpus blobs found; the integration suites would skip and this release would gate on almost nothing."; exit 1; }
          echo "$count locale blobs"

      - run: swift test

      # Only the version bump and what it regenerates may be committed. A tag that quietly
      # carries anything else is a different release than the one reviewed.
      - name: Working tree carries only the version change
        run: |
          git status --short
          unexpected=$(git status --short | grep -vE ' (Sources/Decoy/Decoy.swift|website/src/)' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The release would carry changes beyond the version bump:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and tag
        if: ${{ !inputs.dry-run }}
        run: |
          version="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Decoy/Decoy.swift website/src

          # The version may already be correct -- someone can have bumped it in a normal
          # commit, which is how 1.0.0 was prepared. `git commit` on an empty index exits
          # non-zero, which would fail the run *before* tagging and read as "the release
          # broke" rather than "there was nothing to change". The tag is the release; the
          # commit is only how the version gets there when it is not there already.
          if git diff --cached --quiet; then
            echo "Decoy.version is already $version — tagging the existing commit."
          else
            git commit -m "Release $version"
          fi

          git tag -a "v$version" -m "v$version"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "v$version"

          # Dispatch Release explicitly. Pushing the tag is not enough: this push used the
          # default GITHUB_TOKEN, and GitHub does not start a workflow from an event that
          # token created, so `on: push: tags` never fires here. The tag simply appeared and
          # nothing happened -- silently, which is how the first 1.0.0 attempt "succeeded"
          # while publishing nothing at all.
          #
          # workflow_dispatch is one of the two documented exceptions to that rule.
          # The tag is already pushed by this point and cannot be taken back, so a failure
          # here is recoverable rather than fatal — and says so, instead of exiting 1 with a
          # 403 and leaving somebody to work out that the version is tagged but unpublished.
          if gh workflow run Release -f tag="v$version"; then
            echo "Pushed v$version and dispatched Release."
          else
            echo "::error::v$version is tagged and pushed, but dispatching Release failed. \
          Nothing is published yet and the tag is fine. Run it by hand: \
          gh workflow run Release -f tag=v$version"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "Dry run. Would commit and tag v${{ inputs.version }}:"
          git --no-pager diff -- Sources/Decoy/Decoy.swift website/src
