# Publishes the command-line tools when a version tag is pushed.
#
# The library itself needs no publishing step — SwiftPM resolves a package from a git tag,
# so tagging *is* the release for anybody writing `.package(url:from:)`. What a release
# adds is the three corpus tools as binaries, for people who want to inspect or validate a
# `.decoy` file without checking out a Swift toolchain.
#
# Tagging is the trigger rather than a manual dispatch, so the artifacts can only ever
# correspond to a commit that exists and is named.
name: Release

# Two triggers, and the second is not a convenience.
#
# A tag pushed by `Prepare release` is pushed with the default GITHUB_TOKEN, and GitHub
# deliberately does not start a workflow from an event that token created -- it is how they
# stop a workflow triggering itself forever. So the tag appeared and nothing happened, which
# is the worst shape a release failure can take: no error, no run, just silence.
#
# workflow_dispatch is one of the two documented exceptions to that rule, so `Prepare
# release` dispatches this explicitly after pushing the tag. It also means a release can be
# re-run against an existing tag without moving it, which is the only safe way to recover
# from a failed publish.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, with the v (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Nothing is built until the tag and the source agree. A release whose binaries report a
  # different version than the tag that produced them is worse than no release: it is
  # wrong in a way nobody notices until they are debugging something else.
  verify:
    name: Verify
    runs-on: macos-15
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # Full history and tags: the corpus-coupling check below reads the previous
      # release's corpus version out of git.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Tag matches Decoy.version
        id: check
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          tag="${TAG#v}"
          source=$(grep -oE 'static let version = "[^"]+"' Sources/Decoy/Decoy.swift \
                   | grep -oE '"[^"]+"' | tr -d '"')
          echo "tag=$tag source=$source"
          if [ "$tag" != "$source" ]; then
            echo "::error::Tag $TAG says $tag but Sources/Decoy/Decoy.swift says $source. Update Decoy.version, or tag the version the source declares."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Corpus version is declared
        run: |
          corpus=$(grep -oE '"version": "[^"]+"' Tools/adapters/corpus-version.json \
                   | grep -oE '"[0-9][^"]*"' | tr -d '"')
          [ -n "$corpus" ] || { echo "::error::No corpus version declared."; exit 1; }
          echo "corpus $corpus"

      # A patch release must not move the data.
      #
      # The two numbers answer different questions -- the package version is about the API,
      # the corpus version is about what a seed draws -- and they are deliberately not
      # locked together. But `from: "1.0.0"` resolves patch upgrades automatically, so
      # shipping a corpus change in a patch would rewrite somebody's committed fixtures on
      # a `swift package update` they did not think about. A minor is the smallest release
      # that is allowed to do that, because it is the smallest one a person chooses.
      #
      # Skipped for the first release, which has no predecessor to compare against.
      - name: A corpus change is not a patch release
        run: |
          version="${{ steps.check.outputs.version }}"
          previous=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v "^v$version$" | head -1)
          if [ -z "$previous" ]; then
            echo "No previous tag; nothing to compare."
            exit 0
          fi
          echo "comparing against $previous"

          read_corpus() { git show "$1:Tools/adapters/corpus-version.json" 2>/dev/null \
            | grep -oE '"version": "[^"]+"' | grep -oE '"[0-9][^"]*"' | tr -d '"'; }
          before=$(read_corpus "$previous")
          now=$(grep -oE '"version": "[^"]+"' Tools/adapters/corpus-version.json \
                | grep -oE '"[0-9][^"]*"' | tr -d '"')
          [ -n "$before" ] || { echo "$previous declared no corpus version; skipping."; exit 0; }
          echo "corpus $before -> $now"

          [ "$before" = "$now" ] && { echo "Corpus unchanged."; exit 0; }

          prev_version="${previous#v}"
          if [ "${version%.*}" = "${prev_version%.*}" ]; then
            echo "::error::Corpus moved $before -> $now, but $prev_version -> $version is a patch bump. A corpus change rewrites generated values, and patch upgrades resolve automatically under 'from:'. Release this as a minor instead."
            exit 1
          fi
          echo "Corpus moved and this is not a patch release."

      - run: swift build

      # The corpus is built before testing because roughly thirty suites are gated on
      # Corpus/binary existing and *skip* when it does not. Running `swift test` alone would
      # go green having exercised the ten-path stub, and gate a release on almost nothing.
      - name: Build corpus
        run: |
          swift run -c release decoy-build-corpus
          swift run -c release decoy-compile-corpus Tools/adapters/out Corpus/binary

      - run: swift test

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            runs-on: macos-15
            asset: decoy-tools-${{ needs.verify.outputs.version }}-macos-universal.tar.gz
          - name: Linux (x86_64)
            runs-on: ubuntu-latest
            container: swift:6.3
            asset: decoy-tools-${{ needs.verify.outputs.version }}-linux-x86_64.tar.gz
          - name: Windows (x86_64)
            runs-on: windows-latest
            asset: decoy-tools-${{ needs.verify.outputs.version }}-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: compnerd/gha-setup-swift@main
        if: runner.os == 'Windows'
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      # A universal binary rather than two downloads: the tools are small, and asking
      # somebody to know their own architecture to inspect a data file is a poor trade.
      #
      # Two builds and `lipo` rather than `swift build --arch arm64 --arch x86_64`. The
      # latter is shorter but routes through xcbuild, so it needs a full Xcode and fails on
      # a Command Line Tools install with an error about a missing XCBuild.framework. This
      # form works with either, which means it can be checked before it is relied on.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          swift build -c release --triple arm64-apple-macosx
          swift build -c release --triple x86_64-apple-macosx
          mkdir -p stage
          for tool in decoy-inspect decoy-validate decoy-compile-corpus; do
            lipo -create -output "stage/$tool" \
              ".build/arm64-apple-macosx/release/$tool" \
              ".build/x86_64-apple-macosx/release/$tool"
            lipo -info "stage/$tool"
          done

      # -static-stdlib links the Swift runtime in, so the binary runs on a machine with no
      # Swift installed. That is the whole point of shipping one.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          swift build -c release -Xswiftc -static-stdlib
          mkdir -p stage
          for tool in decoy-inspect decoy-validate decoy-compile-corpus; do
            cp ".build/release/$tool" stage/
          done

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          swift build -c release
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          foreach ($tool in @('decoy-inspect','decoy-validate','decoy-compile-corpus')) {
            Copy-Item ".build\release\$tool.exe" stage\
          }

      # Every archive carries the licence and attribution. The tools read a corpus whose
      # whole argument is that it can name its sources; shipping them stripped of that
      # would be a poor advertisement for the point.
      - name: Package
        shell: bash
        run: |
          cp LICENSE NOTICE stage/
          cd stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../${{ matrix.asset }}" ./*
          else
            tar czf "../${{ matrix.asset }}" ./*
          fi

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  publish:
    name: Publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the signed provenance attestation below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat *.sha256 | sed 's|  .*/|  |' > SHA256SUMS
          rm -f *.sha256
          ls -la

      # A signed statement that these exact bytes came out of this workflow, from this
      # commit. `gh attestation verify decoy-tools-...tar.gz --repo nerdmenot-swift/decoy`
      # checks it, and unlike the checksum file it cannot be regenerated by whoever
      # replaced the download.
      #
      # A library whose entire argument is that every value can name where it came from
      # should be able to say the same about its own binaries.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz, dist/*.zip'

      - name: Release notes
        run: |
          corpus=$(grep -oE '"version": "[^"]+"' Tools/adapters/corpus-version.json \
                   | grep -oE '"[0-9][^"]*"' | tr -d '"')
          cat > notes.md <<EOF
          ## Using the library

          \`\`\`swift
          .package(url: "https://github.com/nerdmenot-swift/decoy", from: "${{ needs.verify.outputs.version }}")
          \`\`\`

          Add \`Decoy\` and at least one \`DecoyLocale*\` product to your target. The default
          corpus is a ten-path smoke-test stub, not a working locale.

          ## Command-line tools

          \`decoy-inspect\`, \`decoy-validate\` and \`decoy-compile-corpus\`, for reading and
          checking a \`.decoy\` file without a Swift toolchain.

          Every archive carries signed build provenance. Check that a download came from
          this repository's release workflow, and not from whoever handed you the file:

          \`\`\`
          gh attestation verify <archive> --repo nerdmenot-swift/decoy
          \`\`\`

          \`SHA256SUMS\` is also published, for checking integrity without \`gh\`.

          Linux binaries link the Swift runtime statically and need nothing installed. The
          Windows build does **not**: it needs the Swift runtime for Windows on the machine.

          ## Corpus

          Corpus version \`$corpus\`. Generated values are reproducible with respect to a
          corpus version — the same seed and the same corpus give the same rows. A major
          corpus bump changes existing values deliberately.
          EOF
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
