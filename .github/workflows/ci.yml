name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to find upstream rot before a contributor does. Forty-seven sources are fetched
  # by URL, and a dead one does not announce itself -- it surfaces whenever somebody next
  # rebuilds the corpus, which is the worst moment to discover it.
  #
  # The scheduled run deliberately skips the artifact cache (see below), because a cache hit
  # would answer "is the cache still there" rather than "is the source still published",
  # and go green on a URL that has 404'd for a month.
  schedule:
    - cron: '17 6 * * 1'

# Read-only. The repository default is already read, so this is here to stop an
# organisation-level change from silently widening what a pull request can do.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Keyed on the source descriptors, so adding or re-pinning a source misses the
      # cache and re-fetches. A hit still re-verifies every artifact against its
      # integrity hash in ArtifactStore, so this costs nothing in safety.
      - name: Cache pinned upstreams
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: Tools/adapters/.cache
          key: corpus-sources-${{ runner.os }}-${{ hashFiles('Tools/adapters/sources/*.json') }}

      # Pinned, not `latest`. A docs build that floats on whatever bun shipped this week
      # can start failing on a commit that changed nothing, and the whole argument of this
      # repository is that a build is reproducible or it is not a build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: swift --version
      - run: swift build

      # Without a compiled corpus the integration suites skip rather than fail, so a
      # regression in an adapter or in the compiler would go unnoticed.
      - name: Build corpus
        run: |
          swift run -c release decoy-build-corpus
          swift run -c release decoy-compile-corpus Tools/adapters/out Corpus/binary

      - run: swift test

      # The four locale modules are committed Swift source generated from the corpus.
      # Nothing ties them to the adapters that produce them, so an adapter change without
      # a regeneration is invisible until someone's fixtures quietly differ.
      - name: Locale modules are current
        run: |
          swift run -c release decoy-compile-corpus Tools/adapters/out Corpus/binary \
            --emit-swift Sources --locales de,ja
          git diff --exit-code -- Sources/DecoyLocale* \
            || { echo "::error::Locale modules are stale. Re-run with --emit-swift and commit."; exit 1; }

      # Attribution is generated from the provenance records embedded in the blobs, so it
      # cannot drift from what actually ships -- but only if it is regenerated.
      - name: NOTICE is current
        run: |
          swift run -c release decoy-inspect --notice Corpus/binary --licenses LICENSES > NOTICE
          git diff --exit-code -- NOTICE \
            || { echo "::error::NOTICE is stale. Regenerate with decoy-inspect --notice --licenses LICENSES and commit."; exit 1; }

      # The matrix tells a user which fields their locale actually supplies before they
      # pick it, so it is only useful if it is true. Generated from the corpus and diffed
      # for the same reason NOTICE is: the source count in the README was correct the day
      # it was written and wrong for months afterwards.
      - name: Locale support matrix is current
        run: |
          swift run -c release decoy-inspect --matrix Corpus/binary > docs/locale-support.md
          git diff --exit-code -- docs/locale-support.md \
            || { echo "::error::docs/locale-support.md is stale. Regenerate with decoy-inspect --matrix and commit."; exit 1; }

      # What the filters threw away, which is the half of the pipeline that leaves no other
      # trace. Every serious data bug here was a silent discard -- a length floor deleting
      # 138 of 143 Korean surnames, a count floor dropping 13 Welsh ones -- and none of them
      # changed a single committed byte, because a filter records only what survived.
      #
      # The corpus build regenerates this file, so a diff here means a filter's behaviour
      # moved. That is sometimes correct and always worth reading.
      - name: Filter losses are recorded
        run: |
          git diff --exit-code -- Tools/adapters/filters.json \
            || { echo "::error::Tools/adapters/filters.json changed: a filter is keeping or dropping a different amount than the committed record. Read the diff — if the change is intended, commit it."; exit 1; }

      # --strict, because the report is clean. A check that always prints ten warnings
      # has no signal in it — the eleventh, the one somebody just introduced, is
      # invisible in the noise, which is the exact failure this whole tool exists to
      # catch. Everything it found is either fixed or declared in a descriptor, so any
      # warning here is new.
      - name: Contribution is well-formed
        run: swift run -c release decoy-validate --strict

      # The site's API pages, source table and locale matrix are derived by calling the
      # library, so they go stale when the library moves rather than when the site does.
      # Checked here because this is the job that already has a compiled corpus — without
      # one, extract.ts keeps the existing data and says so, which would let a stale page
      # through a green run.
      #
      # This is not hypothetical. The reference index said 319 generators and a test that
      # counts a *different* set said 315; someone reading only the test edited the docs to
      # match it. Both numbers were right about different things, and the diff is what
      # says so.
      - name: Website content is current
        run: |
          cd website && bun install --frozen-lockfile && bun run extract && cd ..
          git diff --exit-code -- website/src \
            || { echo "::error::Generated website content is stale. Run 'bun run extract' in website/ and commit."; exit 1; }

      # A regression gate, not a quality bar. Fails when a locale carries less of its own
      # data than the committed baseline, which is what an adapter silently dropping
      # coverage looks like.
      - name: Coverage has not regressed
        run: |
          swift run -c release decoy-inspect --coverage Corpus/binary \
            --gate Corpus/coverage-baseline.json

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: swift:6.3
    steps:
      # The Swift image is Debian slim and carries neither. GNU tar shells out to a
      # separate `xz` binary for .tar.xz, and zips go through `unzip` rather than whichever
      # tar the host has, so both are needed to unpack the pinned artifacts.
      - name: Install archive tools
        run: apt-get update -qq && apt-get install -y -qq xz-utils unzip

      - uses: actions/checkout@v7
      - name: Cache pinned upstreams
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: Tools/adapters/.cache
          key: corpus-sources-${{ runner.os }}-${{ hashFiles('Tools/adapters/sources/*.json') }}

      - run: swift --version
      - run: swift build

      - name: Build corpus
        run: |
          swift run -c release decoy-build-corpus
          swift run -c release decoy-compile-corpus Tools/adapters/out Corpus/binary

      - run: swift test

      # The same suite, optimised. Everything shipped is built `-c release` -- the corpus
      # tools above already are -- and until now no test had ever run against that
      # configuration, so an optimiser-dependent difference in a library whose entire
      # promise is identical output would have shipped unremarked.
      #
      # Here rather than on macOS because this runner is the cheap one and its corpus is
      # already built. It roughly doubles this job; it is the only place the optimised
      # build is exercised at all.
      - name: Tests, optimised
        run: swift test -c release

  # Nothing in the package can see this, which is the point.
  #
  # Every other suite runs *inside* the package, where the products and their dependencies
  # are already resolved. A consumer resolves them from outside, and that is where a broken
  # `.product`, a locale module that does not build standalone, or a resource that is not
  # actually bundled shows up. None of those is visible to `swift test`.
  #
  # It builds against the checkout rather than a published tag, because a pull request has
  # no tag. Tag resolution is checked at release time, where a tag exists.
  consumer:
    name: Consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7

      - name: Build a package that depends on this one
        run: |
          mkdir -p /tmp/consumer/Sources
          cat > /tmp/consumer/Package.swift <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(
              name: "consumer",
              platforms: [.macOS(.v13)],
              dependencies: [.package(path: "PACKAGE_PATH")],
              targets: [.executableTarget(name: "consumer", dependencies: [
                  .product(name: "Decoy", package: "decoy"),
                  .product(name: "DecoyLocaleEN", package: "decoy"),
                  .product(name: "DecoyLocales", package: "decoy"),
              ], path: "Sources")]
          )
          EOF
          sed -i "s|PACKAGE_PATH|$GITHUB_WORKSPACE|" /tmp/consumer/Package.swift

          # The install page's snippet, run as a consumer runs it. DecoyLocales is
          # exercised too because it loads its corpus from bundled resources, which is the
          # part most likely to work in-package and fail outside it.
          cat > /tmp/consumer/Sources/main.swift <<'EOF'
          import Decoy
          import DecoyLocaleEN
          import DecoyLocales

          var faker = Faker(seed: 1337, locale: DecoyLocaleEN.locale)
          let name = faker.person.fullName()
          guard name == "Riley Bonneau" else {
              fatalError("install.md documents \"Riley Bonneau\", got \"\(name)\"")
          }

          let fr = try DecoyLocales.locale("fr")
          var french = Faker(seed: 1337, locale: fr)
          let french_name = french.person.fullName()
          guard !french_name.isEmpty else { fatalError("DecoyLocales returned nothing") }

          print("Decoy \(Decoy.version): \(name) / \(french_name)")
          print("locales reachable at run time: \(DecoyLocales.available.count)")
          EOF

          cd /tmp/consumer && swift run consumer

  # Enforced, now that it passes.
  #
  # This was continue-on-error while Windows could not get through the build, which was the
  # right call then and the wrong one the moment it went green: an allowed failure is a
  # standing exemption, and the next regression would have been invisible inside it. The
  # three things that had to be fixed to get here -- a Foundation-only String API, an ESM
  # loader that rejects `D:\...`, and CRLF being a single Swift Character -- were all
  # silent everywhere else, which is the argument for keeping this honest.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit, not to `main`. This is a third-party action, and it runs in
      # the job that builds on Windows -- previously also the job that produced and signed
      # release artifacts. A moving ref there means whoever controls that branch chooses
      # what runs in a workflow holding a write token.
      #
      # Bump deliberately: read the diff, then move the SHA.
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      # The other two jobs cache the pinned upstreams and this one did not, so it re-fetched
      # all fifty-one artifacts on every run -- the only job fully exposed to a transient
      # upstream, and it duly failed on a PubChem 503 that had nothing to do with Windows.
      # A job that fails for reasons unrelated to what it tests stops being read at all.
      - name: Cache pinned upstreams
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: Tools/adapters/.cache
          key: corpus-sources-${{ runner.os }}-${{ hashFiles('Tools/adapters/sources/*.json') }}

      - run: swift --version
      - run: swift build

      # This job used to run `swift test` with no corpus, so every suite gated on
      # Corpus/binary skipped and Windows was only ever testing the built-in stub --
      # which is exactly the platform where a byte-order or path assumption would show up.
      - name: Build corpus
        run: |
          swift run -c release decoy-build-corpus
          swift run decoy-compile-corpus Tools/adapters/out Corpus/binary

      - run: swift test
