name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: swift --version
      - run: swift build
      # Without this the corpus integration tests skip rather than fail, so a
      # regression in the extractor or compiler would go unnoticed.
      - name: Build corpus
        run: |
          npm ci --prefix Tools/extractor
          node Tools/extractor/extract.js
          swift run -c release decoy-compile-corpus Tools/extractor/out Corpus/binary
      - run: swift test

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: swift --version
      - run: swift build
      - name: Build corpus
        run: |
          npm ci --prefix Tools/extractor
          node Tools/extractor/extract.js
          swift run -c release decoy-compile-corpus Tools/extractor/out Corpus/binary
      - run: swift test

  # Best-effort. Swift on Windows is the least mature of the three toolchains;
  # a failure here should prompt a portability fix, not block a release.
  windows:
    name: Windows (best-effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - run: swift --version
      - run: swift build
      - run: swift test
